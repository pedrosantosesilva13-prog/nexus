<style>
:root{--azul:#2d9bff;--azul2:#5cb6ff;--gelo:#9fd8ff;--texto:#cfe6ff;--branco:#eef6ff;--fraco:rgba(110,180,255,.16);--linha:rgba(110,180,255,.32);--verde:#2dff8a;--verm:#ff4d4d;--ambar:#ffb300;--mono:Consolas,"Roboto Mono",ui-monospace,monospace;--fonte:Bahnschrift,"Segoe UI",Roboto,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#010617;color:var(--texto);font:15px var(--fonte)}
body{background:radial-gradient(ellipse 90% 40% at 50% 0,rgba(35,110,255,.35),transparent 70%),radial-gradient(ellipse 120% 50% at 50% 115%,rgba(25,95,235,.4),transparent 60%),linear-gradient(180deg,#010513,#02103a 60%,#041a58);background-attachment:fixed;padding:calc(64px + env(safe-area-inset-top)) 0 calc(78px + env(safe-area-inset-bottom))}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(160,210,255,.025) 0 1px,transparent 1px 3px)}
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(1,6,23,.94);border-bottom:1px solid var(--linha)}
header svg{width:30px;height:30px}header b{font-weight:300;font-size:18px;letter-spacing:9px;color:var(--branco);text-shadow:0 0 14px var(--azul)}
header small{display:block;font:8px var(--mono);letter-spacing:3px;color:var(--azul2)}
#hora{margin-left:auto;font:200 22px var(--fonte);letter-spacing:2px;color:var(--branco)}
.ponto{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--verde);box-shadow:0 0 8px var(--verde);margin-right:6px}
.ponto.off{background:var(--verm);box-shadow:0 0 8px var(--verm)}
main{padding:14px}
h2{margin:4px 0 14px;font-weight:200;font-size:20px;letter-spacing:6px;white-space:nowrap;color:var(--branco);text-shadow:0 0 14px rgba(45,155,255,.8);display:flex;align-items:center;gap:10px}
h2 button{margin-left:auto}
.voltar{background:none;border:1px solid var(--linha);color:var(--gelo);font:10px var(--mono);letter-spacing:1px;padding:6px 9px;white-space:nowrap}
.vidro{position:relative;padding:14px 16px;margin-bottom:12px;background:linear-gradient(160deg,rgba(40,120,255,.17),rgba(4,18,64,.62) 70%);border:1px solid var(--fraco)}
.vidro::before,.vidro::after{content:"";position:absolute;width:12px;height:12px}
.vidro::before{top:-1px;left:-1px;border-top:1.5px solid var(--gelo);border-left:1.5px solid var(--gelo)}
.vidro::after{bottom:-1px;right:-1px;border-bottom:1.5px solid var(--gelo);border-right:1.5px solid var(--gelo)}
.tit{display:flex;align-items:center;gap:8px;margin-bottom:8px;font:10px var(--mono);letter-spacing:3px;color:#8fc6ff}
.tit::before{content:"";width:6px;height:6px;transform:rotate(45deg);background:var(--azul);box-shadow:0 0 8px var(--azul)}
.tit em{margin-left:auto;font-style:normal;color:rgba(143,198,255,.5)}
.grande{font-weight:200;font-size:30px;color:var(--branco)}.grande small{font-size:11px;letter-spacing:2px;color:var(--azul2);margin-left:6px}
p{margin:4px 0;font-weight:300;line-height:1.45}
.l2{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed rgba(110,180,255,.14);font-size:13px;font-weight:300}.l2:last-child{border:0}.l2 b{font-weight:400;color:#fff}
.pos{color:var(--verde)!important}.neg{color:#ff8a8a!important}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grade .vidro{margin:0}
.item{display:block;padding:12px 14px;margin-bottom:8px;background:linear-gradient(90deg,rgba(40,120,255,.2),rgba(4,18,64,.25));border-left:2px solid var(--azul2);color:var(--texto);text-decoration:none;font-weight:300;font-size:14px}
.item small{display:block;margin-top:3px;font:10px var(--mono);color:var(--azul2);letter-spacing:1px}
.item b{font-weight:400;color:#fff}
.vazio{color:#8fb8e8;font-size:12px}
.botao{padding:11px 14px;border:1px solid var(--azul2);background:linear-gradient(180deg,rgba(45,155,255,.38),rgba(26,99,214,.28));color:#fff;font:11px var(--mono);letter-spacing:2px}
.botao.sec{border-color:var(--linha);background:rgba(4,18,64,.6);color:#9fd0ff}
.botao:active{transform:scale(.97)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{padding:7px 10px;border:1px solid var(--fraco);background:rgba(2,12,44,.6);color:#9fd0ff;font:10px var(--mono);letter-spacing:1px}
.chips button.on{border-color:var(--gelo);color:#fff;background:rgba(45,155,255,.25)}
textarea,input[type=text]{width:100%;padding:12px;background:rgba(1,8,32,.85);color:#fff;border:1px solid var(--linha);font:15px var(--fonte);outline:none}
textarea:focus,input[type=text]:focus{border-color:var(--gelo)}
/* núcleo */
.orbe{position:relative;width:62vw;max-width:280px;aspect-ratio:1;margin:6px auto 4px}
.orbe .esfera{position:absolute;inset:22%;border-radius:50%;background:radial-gradient(circle at 42% 38%,#eaf6ff 0,#7fc4ff 14%,#2d9bff 36%,rgba(20,80,220,.35) 62%,transparent 72%);box-shadow:0 0 50px rgba(45,155,255,.55);animation:respira 4s ease-in-out infinite}
.orbe i{position:absolute;inset:6%;border-radius:50%;border:1px solid rgba(159,216,255,.55);animation:gira 9s linear infinite}
.orbe i:nth-child(2){inset:12%;border-style:dashed;border-color:rgba(92,182,255,.45);animation-duration:14s;animation-direction:reverse}
.orbe i:nth-child(3){inset:0;border-color:rgba(110,180,255,.25);transform:rotateX(70deg);animation:gira3 7s linear infinite}
.orbe.fala .esfera{animation:fala .5s ease-in-out infinite}
@keyframes respira{50%{transform:scale(1.04);opacity:.9}}@keyframes fala{50%{transform:scale(1.1)}}
@keyframes gira{to{transform:rotate(360deg)}}@keyframes gira3{to{transform:rotateX(70deg) rotate(360deg)}}
.estado{text-align:center;font:10px var(--mono);letter-spacing:5px;color:#9fd0ff;margin-bottom:14px}
/* conversa */
#msgs{display:flex;flex-direction:column;gap:8px;padding-bottom:70px}
.bal{max-width:86%;padding:10px 13px;font-size:14px;font-weight:300;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.bal.eu{align-self:flex-end;background:linear-gradient(135deg,#1a63d6,#2d9bff);color:#fff}
.bal.nx{align-self:flex-start;background:rgba(4,18,64,.75);border:1px solid var(--fraco)}
.bal.nx::before{content:"NEXUS";display:block;font:8px var(--mono);letter-spacing:3px;color:var(--azul2);margin-bottom:4px}
#entrada{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));display:flex;gap:6px;padding:8px 10px;background:rgba(1,6,23,.96);border-top:1px solid var(--linha)}
#entrada input{flex:1;min-width:0}
.botao.mic{padding:0 12px}.botao.mic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.botao.mic.gravando{background:rgba(255,77,77,.35);border-color:#ff4d4d;animation:pulsoMic 1s ease-in-out infinite}
@keyframes pulsoMic{50%{box-shadow:0 0 0 8px rgba(255,77,77,.15)}}
/* controle */
.ctl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ctl button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px;background:rgba(2,12,44,.6);border:1px solid var(--fraco);color:#cfe6ff;font:9px var(--mono);letter-spacing:1px}
.ctl button:active{background:rgba(45,155,255,.3);border-color:var(--gelo)}
.ctl svg,.nav svg,.mais svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
/* galeria */
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gal a{display:block;border:1px solid var(--linha);background:#02103a center/cover no-repeat;aspect-ratio:16/10;position:relative;color:#fff;text-decoration:none}
.gal a span{position:absolute;left:0;right:0;bottom:0;padding:14px 8px 5px;font:9px var(--mono);letter-spacing:1px;background:linear-gradient(transparent,rgba(1,6,23,.9))}
/* escuta */
.escutaPill{position:fixed;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:60;border:0;border-radius:999px;padding:6px 14px;font:500 11px var(--fonte);letter-spacing:.08em;color:#fff;background:linear-gradient(135deg,#6B4FD8,#9C6BFF);box-shadow:0 0 24px -4px var(--roxo);animation:pulso 2s ease-in-out infinite}@keyframes pulso{50%{opacity:.65}}
/* rotinas */
.rdias{display:flex;gap:6px;margin:4px 0 10px}.rdias i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:500 10px var(--fonte);font-style:normal;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--hair)}.rdias i.on{background:rgba(156,107,255,.35);box-shadow:inset 0 0 0 1px var(--lavanda)}
.rpasso{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;margin-bottom:6px;border-radius:14px;background:rgba(255,255,255,.04)}.rpasso b{font:500 12px var(--mono);color:var(--lavanda);min-width:42px;padding-top:2px}.rpasso>div{display:flex;flex-direction:column;gap:2px;min-width:0}.rpasso em{font-style:normal;font-size:12px;opacity:.65}.rpasso.feito span{text-decoration:line-through;opacity:.5}.rpasso.fora{opacity:.4}
.rck{width:24px;height:24px;border-radius:50%;border:0;flex:none;background:transparent;box-shadow:inset 0 0 0 1.5px var(--hair2);color:#fff;font-size:13px;padding:0}.rpasso.feito .rck{background:linear-gradient(135deg,#6B4FD8,#9C6BFF)}.racoes{display:flex;gap:8px;margin-top:8px}.racoes .botao{flex:1}.mini{font-size:11px;opacity:.6;margin-top:8px}
/* mais */
.mais{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mais button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 4px;background:linear-gradient(160deg,rgba(40,120,255,.17),rgba(4,18,64,.62));border:1px solid var(--fraco);color:#cfe6ff;font:9px var(--mono);letter-spacing:2px}
/* navegação */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom));background:rgba(1,6,23,.97);border-top:1px solid var(--linha)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;background:none;border:0;color:#6f9fd6;font:8px var(--mono);letter-spacing:1px}
.nav button.on{color:#fff}.nav button.on svg{filter:drop-shadow(0 0 5px var(--azul));color:var(--gelo)}
.aviso{position:fixed;left:12px;right:12px;bottom:calc(140px + env(safe-area-inset-bottom));z-index:9;padding:11px 14px;background:rgba(4,18,64,.97);border:1px solid var(--azul2);font-size:13px;display:none}
.toggle{display:flex;align-items:center;gap:8px;font:10px var(--mono);letter-spacing:1px;color:#9fd0ff}
/* =================== GALÁXIA (mesmo visual do PC) =================== */
:root{--bg:#05030f;--violeta:#6B4FD8;--roxo:#9C6BFF;--lavanda:#C9B6FF;--poeira:#F3EEFF;--acrecao:#FF9A3C;--brilho:rgba(156,107,255,.45);--hair:rgba(201,182,255,.10);--hair2:rgba(201,182,255,.18);--texto:#E9E3FA;--suave:#9C93BF;--verde:#5CF2C8;--verm:#FF5C8A;--ambar:#FFB547;--branco:#F6F2FF;--azul2:#C9B6FF;--gelo:#C9B6FF;--linha:var(--hair2);--fraco:var(--hair);--fonte:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:Inter,system-ui,sans-serif;--titulo:Orbitron,Inter,sans-serif;--assinatura:linear-gradient(135deg,#1B1F5E,#6B4FD8 45%,#C9B6FF 75%,#FF9A3C)}

header{background:rgba(5,3,15,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--hair);padding:calc(10px + env(safe-area-inset-top)) 18px 10px}

/* núcleo: buraco negro em CSS (disco girando, anel de fótons, sombra) */
.orbe{width:74vw;max-width:320px;margin:4px auto 6px;aspect-ratio:1}

.orbe i{inset:36% -18%;border:0;border-radius:50%;transform:rotate(-24deg);animation:none;background:conic-gradient(from var(--g,0deg),rgba(255,154,60,.95),#F3EEFF 12%,#C9B6FF 28%,#6B4FD8 50%,rgba(27,31,94,.4) 70%,#9C6BFF 85%,rgba(255,154,60,.95));-webkit-mask:radial-gradient(ellipse 50% 50% at 50% 50%,transparent 33%,#000 36%,#000 62%,transparent 72%);mask:radial-gradient(ellipse 50% 50% at 50% 50%,transparent 33%,#000 36%,#000 62%,transparent 72%);filter:blur(1.2px);animation:disco 7s linear infinite}
